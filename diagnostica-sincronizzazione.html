<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://js.jotform.com/JotFormCustomWidget.min.js">document.getElementById('clear').onclick=()=>{role='sender';value='';jf.sendData({value});try{sessionStorage.setItem(key,value);report('Valore vuoto pubblicato in sessionStorage');}catch(e){report('sessionStorage non disponibile');}report('Dato cancellato');};
</script><style>body{font:15px Arial;margin:12px}button{padding:10px;margin:5px}pre{white-space:pre-wrap}</style></head><body><strong>TEST sincronizzazione v4</strong><p>Ricezione automatica all’avvio. Usare il pulsante mittente solo nella prima istanza.</p><button id="sender" disabled>Mittente: trasmetti dato</button><button id="clear" disabled>Mittente: cancella dato</button><button id="receiver" disabled>Ricevente: ascolta</button><pre id="log" role="status">Attesa Jotform...</pre><script>
const jf=window.JFCustomWidget,key='orved_diagnostica_session_v4';let role='receiver',value='';
const log=document.getElementById('log');function report(s){log.textContent+='\n'+s;jf.requestFrameResize({height:document.body.scrollHeight+30});}
function receive(v){if(role!=='receiver'||typeof v!=='string'||v===value)return;value=v;jf.sendData({value});report('Ricevuto e trasmesso a Jotform: '+(value||'[vuoto]'));}
jf.subscribe('ready',()=>{log.textContent='Widget pronto. Ricevente automatico in ascolto.';document.getElementById('sender').disabled=false;document.getElementById('clear').disabled=false;document.getElementById('receiver').disabled=false;window.addEventListener('storage',e=>{if(e.key===key && e.storageArea===sessionStorage)receive(e.newValue);});jf.subscribe('submit',()=>jf.sendSubmit({valid:true,value}));});
document.getElementById('receiver').onclick=()=>{role='receiver';value='';report('Ricevente in ascolto.');};
document.getElementById('sender').onclick=()=>{role='sender';value='TEST SEDE ROMA '+Date.now();jf.sendData({value});try{sessionStorage.setItem(key,value);report('Dato pubblicato in sessionStorage');}catch(e){report('sessionStorage non disponibile');}report(value);};
</script></body></html>
