<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script><style>body{font:15px Arial;margin:12px}button,select{padding:8px;margin:4px}pre{white-space:pre-wrap}</style></head><body><strong>TEST sincronizzazione v7</strong><p>Ruolo assegnato automaticamente tramite qid.</p><label>Ruolo <select id="role" disabled><option value="">Non configurato</option><option value="sender">Mittente</option><option value="name">Ricevente Nome</option><option value="address">Ricevente Indirizzo</option><option value="email">Ricevente Email</option></select></label><div id="actions"><button id="a" disabled>Cliente ALFA</button><button id="b" disabled>Cliente BETA</button></div><pre id="log" role="status">Attesa Jotform...</pre><script>
const jf=window.JFCustomWidget,key='orved_diagnostica_session_v7_263284710948061';
const role=document.getElementById('role'),log=document.getElementById('log');let value='';role.value='';document.getElementById('actions').hidden=true;const roles={'6':'sender','7':'name','12':'address','13':'email'};
function report(s){log.textContent+='\n'+s;jf.requestFrameResize({height:document.body.scrollHeight+30});}
function receive(raw){if(!role.value||role.value==='sender'||typeof raw!=='string')return;try{const p=JSON.parse(raw);const v=p[role.value];if(typeof v!=='string')return;value=v;jf.sendData({value});report('Ricevuto e trasmesso: '+(value||'[vuoto]'));}catch(e){report('Errore ricezione: '+e.message);}}
function publish(p){if(role.value!=='sender')return;value=p.name;jf.sendData({value});try{sessionStorage.setItem(key,JSON.stringify({...p,nonce:Date.now()}));report('Trasmesso: '+JSON.stringify(p));}catch(e){report('Errore sessionStorage: '+e.message);}}
jf.subscribe('ready',()=>{log.textContent='Widget pronto.';let qid='';try{qid=String(jf.getWidgetSettings()?.qid??'');}catch(e){report('Errore impostazioni: '+e.message);}role.value=Object.prototype.hasOwnProperty.call(roles,qid)?roles[qid]:'';report('qid: '+qid);report('Ruolo automatico: '+(role.value||'[non configurato]'));document.getElementById('actions').hidden=role.value!=='sender';document.getElementById('a').disabled=role.value!=='sender';document.getElementById('b').disabled=role.value!=='sender';if(role.value)window.addEventListener('storage',e=>{if(e.key===key&&e.storageArea===sessionStorage)receive(e.newValue);});jf.subscribe('submit',()=>jf.sendSubmit({valid:true,value}));});
document.getElementById('a').onclick=()=>publish({name:'Supermercato ALFA',address:'Via Roma, 25',email:'alfa@example.com'});
document.getElementById('b').onclick=()=>publish({name:'Supermercato BETA',address:'Via Milano, 40',email:''});
</script></body></html>
