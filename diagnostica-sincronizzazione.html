<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script><style>body{font:15px Arial;margin:12px}button{padding:10px;margin:5px}pre{white-space:pre-wrap}</style></head><body><strong>TEST sincronizzazione v1</strong><p>Configurare una istanza come mittente e una come ricevente.</p><button id="sender" disabled>Mittente: trasmetti dato</button><button id="receiver" disabled>Ricevente: ascolta</button><pre id="log" role="status">Attesa Jotform...</pre><script>
const jf=window.JFCustomWidget,key='orved_diagnostica_sync_v1';let role='',value='',channel=null;
const log=document.getElementById('log');function report(s){log.textContent+='\n'+s;jf.requestFrameResize({height:document.body.scrollHeight+30});}
function receive(v){if(role!=='receiver'||!v)return;value=v;jf.sendData({value});report('Ricevuto e trasmesso a Jotform: '+value);}
jf.subscribe('ready',()=>{log.textContent='Widget pronto.';document.getElementById('sender').disabled=false;document.getElementById('receiver').disabled=false;try{channel=new BroadcastChannel(key);channel.onmessage=e=>receive(e.data);}catch(e){report('BroadcastChannel non disponibile');}window.addEventListener('storage',e=>{if(e.key===key)receive(e.newValue);});jf.subscribe('submit',()=>jf.sendSubmit({valid:true,value}));});
document.getElementById('receiver').onclick=()=>{role='receiver';value='';report('Ricevente in ascolto.');};
document.getElementById('sender').onclick=()=>{role='sender';value='TEST SEDE ROMA '+Date.now();jf.sendData({value});try{localStorage.setItem(key,value);report('Dato pubblicato in localStorage');}catch(e){report('localStorage non disponibile');}if(channel){channel.postMessage(value);report('Dato pubblicato in BroadcastChannel');}report(value);};
</script></body></html>
