<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLIENTE</title>
<style>
body{font-family:Arial,sans-serif;margin:0;padding:12px;color:#222;font-size:14px}
h3{margin:0 0 12px;font-size:16px}
label{display:block;font-weight:700;margin:10px 0 5px}
input,button{box-sizing:border-box;font:inherit}
input{width:100%;padding:9px;border:1px solid #999;border-radius:4px;background:#fff}
button{padding:9px 12px;border:1px solid #888;border-radius:4px;background:#fff;cursor:pointer}
.results{border:1px solid #bbb;border-top:0;background:#fff;max-height:260px;overflow:auto}
.result{padding:10px;border-top:1px solid #eee;cursor:pointer}
.result:hover{background:#f3f3f3}
.card{border:1px solid #bbb;border-radius:5px;padding:10px;margin-top:10px;background:#fafafa}
.muted{color:#666;font-size:12px}
.error{color:#a00000;font-size:12px;margin-top:7px}
.hidden{display:none}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
</style>
<script src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
</head>
<body>
<h3>CLIENTE</h3>
<label for="search">Cerca cliente</label>
<input id="search" type="search" autocomplete="off" placeholder="Cerca insegna, ragione sociale o indirizzo...">
<div id="results" class="results hidden"></div>\n<div id="status" class="muted" role="status" aria-live="polite">Caricamento clienti...</div>
<div id="selected" class="card hidden"></div>
<div class="actions">
  <button id="newBtn" type="button">+ Aggiungi nuovo cliente</button>
  <button id="clearBtn" type="button">Azzera</button>
</div>
<div id="newForm" class="card hidden">
  <label>Nome / Insegna</label><input id="name">
  <label>Ragione Sociale</label><input id="company">
  <label>Indirizzo</label><input id="address">
  <label>Comune</label><input id="city">
  <label>Provincia</label><input id="province">
  <div class="actions">
    <button id="saveBtn" type="button">Salva cliente</button>
    <button id="cancelBtn" type="button">Annulla</button>
  </div>
  <div id="error" class="error"></div>
</div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyxdCMuqQ-jH7WrS1fvGLTEYeZ3VgZIqaUQc4Bqtm-te-smG18989Zv9WrnRwllq9V8/exec';
let clients=[],selected=null,clientsLoaded=false,readyValue='';
const CLIENT_SYNC_KEY='assistenza_tecnica_selected_client_v1';
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalizeClient(c){return {id:String(c.ID_Cliente??c.id??c.id_cliente??''),name:String(c.Nome_Insegna??c.name??c.nome_insegna??''),company:String(c.Ragione_Sociale??c.company??c.ragione_sociale??''),address:String(c.Indirizzo??c.address??c.indirizzo??''),city:String(c.Comune??c.city??c.comune??''),province:String(c.Provincia??c.province??c.provincia??'')};}
function extractClients(json){if(Array.isArray(json))return json;if(json&&Array.isArray(json.data))return json.data;if(json&&Array.isArray(json.clienti))return json.clienti;if(json&&Array.isArray(json.results))return json.results;if(json&&Array.isArray(json.rows))return json.rows;return [];}
async function loadClients(){
  $('status').textContent='Caricamento clienti...';
  try{
    const response=await fetch(API_URL+'?action=clienti',{method:'GET',cache:'no-store'});
    if(!response.ok)throw new Error('Risposta HTTP '+response.status);
    const json=await response.json();
    clients=extractClients(json).map(normalizeClient).filter(c=>c.id&& (c.name||c.company));
    clientsLoaded=true;
    $('status').textContent=clients.length?`Clienti caricati: ${clients.length}`:'Nessun cliente presente nell’anagrafica.';
    restoreSavedValue(readyValue);
  }catch(err){
    clients=[];clientsLoaded=false;
    $('status').textContent='Impossibile caricare i clienti dal database. Verifica la connessione al servizio.';
    console.error('Errore caricamento clienti:',err);
    restoreSavedValue(readyValue);
  }
  scheduleResize();
}
function resizeWidget(){if(window.JFCustomWidget?.requestFrameResize){const h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight)+8;JFCustomWidget.requestFrameResize({height:h});}}
function scheduleResize(){requestAnimationFrame(resizeWidget)}
function valueForJotform(){return selected ? String(selected.id) : '';}
function legacyValueForStorage(){if(!selected)return '';return JSON.stringify({ID_Cliente:selected.id,Nome_Insegna:selected.name,Ragione_Sociale:selected.company,Indirizzo:selected.address,Comune:selected.city,Provincia:selected.province});}
function syncClient(){try{if(selected)localStorage.setItem(CLIENT_SYNC_KEY,valueForJotform());else localStorage.removeItem(CLIENT_SYNC_KEY);}catch(e){}}
function sendData(){if(!window.JFCustomWidget)return;JFCustomWidget.sendData({value:valueForJotform()});}
function renderSelected(){if(!selected){$('selected').classList.add('hidden');$('selected').innerHTML='';return;} $('selected').innerHTML=`<strong>${esc(selected.name)}</strong><br>${esc(selected.company)}<br>${esc(selected.address)}${selected.city?', '+esc(selected.city):''}${selected.province?', '+esc(selected.province):''}`;$('selected').classList.remove('hidden');}
function renderResults(list){$('results').innerHTML=list.map(c=>`<div class="result" data-id="${esc(c.id)}"><strong>${esc(c.name)}</strong><br><span class="muted">${esc(c.company)} · ${esc(c.address)}${c.city?', '+esc(c.city):''}${c.province?', '+esc(c.province):''}</span></div>`).join('');$('results').classList.toggle('hidden',!list.length);$('results').querySelectorAll('.result').forEach(el=>{el.onclick=()=>{const c=clients.find(x=>String(x.id)===String(el.dataset.id));if(c)selectClient(c);};});scheduleResize();}
function selectClient(c){selected={id:String(c.id??''),name:String(c.name??''),company:String(c.company??''),address:String(c.address??''),city:String(c.city??''),province:String(c.province??'')};$('search').value='';$('results').classList.add('hidden');$('newForm').classList.add('hidden');renderSelected();syncClient();sendData();scheduleResize();}
function restoreSavedValue(value){
 selected=null;
 const raw=String(value??'').trim();
 if(raw){
   let id='';
   try{
     const saved=JSON.parse(raw);
     if(saved&&typeof saved==='object') id=String(saved.ID_Cliente??saved.id??'');
   }catch(e){
     id=raw;
   }
   if(id){
     const master=clients.find(c=>String(c.id)===id);
     if(master) selected={...master};
     else { selected=null; }
   }
 }
 renderSelected();syncClient();sendData();scheduleResize();
}
function clearAll(){selected=null;$('search').value='';$('results').classList.add('hidden');$('newForm').classList.add('hidden');renderSelected();syncClient();sendData();scheduleResize();}
$('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();renderResults(q?clients.filter(c=>(c.name+' '+c.company+' '+c.address+' '+c.city+' '+c.province).toLowerCase().includes(q)):[]);});
$('newBtn').onclick=()=>{$('newForm').classList.remove('hidden');scheduleResize()};
$('cancelBtn').onclick=()=>{$('newForm').classList.add('hidden');scheduleResize()};
$('clearBtn').onclick=clearAll;
$('saveBtn').onclick=()=>{$('error').textContent='';const c={id:'NEW-'+Date.now(),name:$('name').value.trim(),company:$('company').value.trim(),address:$('address').value.trim(),city:$('city').value.trim(),province:$('province').value.trim()};if(!c.name||!c.company||!c.address){$('error').textContent='Compila Nome/Insegna, Ragione Sociale e Indirizzo.';scheduleResize();return;}clients.push(c);['name','company','address','city','province'].forEach(id=>$(id).value='');selectClient(c);};
if(window.ResizeObserver)new ResizeObserver(scheduleResize).observe(document.body);
if(window.JFCustomWidget){JFCustomWidget.subscribe('ready',function(formData){readyValue=formData&&formData.value;JFCustomWidget.subscribe('submit',function(){JFCustomWidget.sendSubmit({valid:!!selected,value:valueForJotform()});});loadClients();});}else{loadClients();}
scheduleResize();
</script>
</body>
</html>
